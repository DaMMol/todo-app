services:
  postgres:
    image: postgres:16.6-alpine
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      retries: 10
    restart: always
    environment:
      POSTGRES_PASSWORD: example
    ports:
      - 4501:5432

  backend:
    build: .
    restart: always
    ports:
      - 3000:3000
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:example@postgres:5432/postgres
      JWT_SECRET: supersecret
    command: sh -c "npx knex migrate:latest && npm start"

  adminer:
    image: adminer
    restart: always
    ports:
      - 4502:8080
